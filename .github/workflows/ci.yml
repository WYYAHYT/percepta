name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.10"
          enable-cache: true

      # Deliberately BEFORE installing anything: a non-portable lockfile will fail every
      # package download later, so catching it first gives an actionable error instead of a
      # wall of "not found". This has already slipped through twice by locking against a
      # domestic mirror for speed (decision D34).
      - name: Check lockfiles are portable
        run: python scripts/check_lock_portability.py --list

      - name: Verify every lockfile is up to date
        run: |
          uv lock --check
          cd uv_envs/sam3 && uv lock --check

      - name: Sync (no GPU, no model weights)
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Test
        # GPU tests are skipped by default (see tests/conftest.py); this job has no GPU.
        run: uv run pytest -q

      - name: End-to-end smoke (real uvicorn, in-process vs HTTP)
        run: uv run python scripts/e2e_smoke.py
