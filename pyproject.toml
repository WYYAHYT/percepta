[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "percepta"
version = "0.2.2"
description = "percepta — a pluggable observation layer for robot agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "percepta authors" }]
keywords = ["robotics", "perception", "segmentation", "agent"]
classifiers = [
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: Apache Software License",
]
dependencies = [
  "pydantic>=2",
  "numpy>=1.26,<2.4",
  "pillow>=10",
  "pyyaml>=6",
]

[project.optional-dependencies]
# Serving over HTTP. Kept out of the default install so the core stays light.
service = ["fastapi>=0.110", "uvicorn>=0.27"]

# NOTE: there is deliberately NO `sam3` extra here.
#
# There used to be one, and it was broken by construction: resolving `torch` from PyPI
# yields the CPU build (no "+cu128"), and `psutil` — which sam3 0.1.4 imports without
# declaring — was missing, so `uv sync --extra sam3` produced an environment where
# `import sam3` fails. It also disagreed with the environment that actually runs the model.
#
# A model runtime needs its own index and its own lock, so it is a separate project:
#     uv sync --project uv_envs/sam3 --python 3.10
# See docs/model-isolation.md §5 and decision D33.

[project.scripts]
percepta = "percepta.cli:main"

[project.entry-points."percepta.tools"]
fake = "percepta.tools.fake:FakeTool"
sam3 = "percepta.tools.sam3:Sam3Tool"
multi_view_3d = "percepta.tools.multi_view_3d:MultiView3DTool"

[dependency-groups]
# PEP 735 groups. `uv sync` installs `dev` by default, so a fresh clone can run the
# test suite immediately; `--no-dev` gives a minimal runtime environment.
#
# `fastapi`/`uvicorn` are listed here as well as in the `service` extra on purpose: the
# contract test suite imports the ASGI app, so a dev environment without them cannot even
# collect `tests/contract`. Duplicating two small packages beats a `uv sync` that installs
# successfully but then fails 26 tests with ModuleNotFoundError.
dev = [
  "pytest>=7",
  "httpx>=0.25",
  "ruff>=0.4",
  "fastapi>=0.110",
  "uvicorn>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/percepta"]

[tool.uv]
# The project is an application/library hybrid: `uv sync` should install the package
# itself in editable mode so `percepta` and the `percepta.tools` entry points resolve.
package = true
# Fail fast on resolution problems rather than silently backtracking for minutes.
resolution = "highest"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "gpu: requires a GPU and/or model weights; skipped by default",
]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
