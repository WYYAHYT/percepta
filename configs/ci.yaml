# CI / development config: no GPU, no weights, no network.
# The full spatial pipeline is exercised with the `fake` segmenter (spec §5.4).
server:
  host: 127.0.0.1
  port: 8790
  max_body_bytes: 33554432
  max_queue: 8
  request_timeout_ms: 120000
  token_env: PERCEPTA_TOKEN
device:
  cuda_visible_devices: ""
pipeline:
  default: ["fake", "multi_view_3d"]
tools:
  fake:
    enabled: true
    tolerance: 40.0
    min_area_px: 16
  multi_view_3d:
    enabled: true
    prism_step_m: 0.01
    prism_max_height_m: 0.5
    prism_iou_threshold: 0.5
  sam3:
    enabled: false
cache:
  enabled: true
  max_entries: 256
  ttl_s: 300
logging:
  level: info
  json: false
metrics:
  enabled: true
