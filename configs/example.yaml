# SAM3 subprocess template (spec §11.1), revised 2026-11-12.
# Revision history: docs/documentation-changes.md.
# Build the isolated runtime: uv sync --project uv_envs/sam3 --locked (no root `sam3` extra).
# Supply gated weights and the BPE vocabulary at the paths below; neither is vendored.
server:
  host: 127.0.0.1
  port: 8790
  max_body_bytes: 33554432
  max_queue: 8
  request_timeout_ms: 120000
  token_env: PERCEPTA_TOKEN
device:
  cuda_visible_devices: "0"
pipeline:
  default: ["sam3", "multi_view_3d"]
tools:
  sam3:
    enabled: true
    # Keep torch in the model's independent environment (docs/model-isolation.md).
    # SAM3 also supports inprocess with compatible dependencies, or a model HTTP service.
    backend: subprocess
    python: uv_envs/sam3/.venv/bin/python
    # Explicit GPU choice; the service does not select a free GPU or reserve its memory.
    cuda_visible_devices: "0"
    checkpoint: /models/sam3.pt
    bpe_path: /models/bpe_simple_vocab_16e6.txt.gz
    resolution: 1008
    min_score: 0.2
  fake:
    enabled: false
cache:
  enabled: true
  max_entries: 256
  ttl_s: 300
logging:
  level: info
  json: true
metrics:
  enabled: false
