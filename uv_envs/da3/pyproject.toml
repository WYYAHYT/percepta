[project]
name = "percepta-da3-env"
version = "0.1.0"
description = "Isolated DA3-BASE calibrated multi-view inference runtime"
# Upstream requires numpy<2; its last compatible NumPy wheels support Python through 3.12.
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.11.0+cu128",
  "torchvision==0.26.0+cu128",
  "torchaudio==2.11.0+cu128",
  "numpy>=1.26,<2",
  "pillow>=10",
  "opencv-python-headless>=4.9",
  "einops>=0.8",
  "huggingface-hub>=0.34,<1",
  "safetensors>=0.5",
  "omegaconf>=2.3",
  "evo>=1.31",
  "moviepy==1.0.3",
  "trimesh>=4",
  "plyfile>=1",
  "pycolmap>=3.11",
  "addict>=2.4",
  "pydantic>=2",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
