[project]
name = "percepta-fast-foundation-stereo-env"
version = "0.1.0"
description = "Isolated official Fast-FoundationStereo research inference runtime"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.6.0+cu124",
  "torchvision==0.21.0+cu124",
  "torchaudio==2.6.0+cu124",
  "xformers==0.0.29.post3",
  "numpy==1.26.4",
  "timm==1.0.15",
  "einops>=0.8,<0.9",
  "omegaconf==2.3.0",
  "scipy>=1.14,<1.16",
  "scikit-image>=0.24,<0.26",
  "opencv-contrib-python-headless==4.10.0.84",
  "imageio>=2.36,<3",
  "pyyaml>=6",
  "open3d==0.19.0",
  "pydantic>=2",
  "gdown==5.2.0",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }
xformers = { index = "pytorch-cu124" }
