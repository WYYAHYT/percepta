[project]
name = "percepta-foundation-stereo-env"
version = "0.1.0"
description = "Isolated FoundationStereo research inference runtime"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch==2.4.1+cu124",
  "torchvision==0.19.1+cu124",
  "xformers==0.0.28.post1",
  "numpy==1.26.4",
  "timm==1.0.11",
  "huggingface-hub==0.26.2",
  "omegaconf==2.3.0",
  "opencv-python-headless==4.10.0.84",
  "open3d==0.19.0",
  "einops==0.8.0",
  "imageio==2.36.1",
  "joblib==1.4.2",
  "pandas==2.2.3",
  "scipy==1.14.1",
  "trimesh==4.5.2",
  "pydantic>=2",
  "gdown==5.2.0",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
xformers = { index = "pytorch-cu124" }
